name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and validate the full stack application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Django dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: server
        run: python manage.py check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Express and Mongo dependencies
        working-directory: server/database
        run: npm install

      - name: Install React dependencies
        working-directory: server/frontend
        run: npm install

      - name: Build the React front end
        working-directory: server/frontend
        run: npm run build

      - name: Report CI result
        run: echo "CI pipeline completed successfully - all checks passed"
