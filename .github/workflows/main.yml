name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 -r server/requirements.txt

      - name: Run Linter
        run: |
          flake8 server \
            --max-line-length=140 \
            --exclude=server/frontend,server/static,server/.venv,server/djangoapp/migrations \
            --count --statistics

      - name: Report Python lint result
        run: echo "Python lint job completed successfully"

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JavaScript dependencies
        run: npm install --no-save eslint@8 eslint-plugin-react@7

      - name: Run Linter
        run: |
          npx eslint server/frontend/src server/database \
            --ext .js,.jsx --no-error-on-unmatched-pattern

      - name: Report JavaScript lint result
        run: echo "JavaScript lint job completed successfully"
